# Verificação automática do Hub — roda sozinha a cada envio de código.
# Se algo quebrar (lint, build ou os testes de tela), o GitHub avisa ANTES
# de publicar. Assim a consultora nunca recebe uma versão com erro.
name: CI — verificação automática

on:
  push:
  pull_request:

# Cancela execuções antigas do mesmo branch quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build de produção
        run: npm run build

      # Os testes que não precisam de navegador rodam ANTES dos de tela: são
      # segundos contra minutos, e é onde mora a prova de que os NÚMEROS estão
      # certos. Um erro de cálculo não aparece como tela quebrada — aparece
      # como afirmação falsa numa reunião, que é bem pior.
      # As funções de formato são as menores do sistema e as mais vistas: elas
      # decidem como todo número e toda data APARECEM. Nenhum defeito ali
      # quebra uma tela — só faz a tela dizer a coisa errada com naturalidade,
      # que é o motivo de valerem um teste próprio.
      - name: Formato de números e datas
        run: npm run test:formato

      - name: Motor do estudo (fuzz de 4.000 entradas)
        run: npm run test:motor

      - name: Auditoria de 10.000 planejamentos (qualidade do conselho)
        run: npm run test:planejamento

      # As ferramentas que precificam a apólice: a faixa de prêmio por
      # cobertura, os três níveis do plano e a decomposição da carteira que o
      # cliente já tem. São números ditos em voz alta na reunião — e o teto de
      # orçamento é uma promessa que não pode ser quebrada por arredondamento.
      - name: Preço, níveis do plano e carteira existente
        run: npm run test:premio

      # As camadas que produzem TEXTO dito em voz alta na reunião, e afirmações
      # que o cliente pode conferir com o advogado dele. Duas promessas aqui não
      # podem falhar nunca: restrição de cobertura sempre dita, e beneficiário
      # menor sempre avisado.
      # A apuração dos GB Awards é o único número do sistema que decide QUEM
      # SOBE NO PALCO. Um erro aqui não quebra tela nenhuma: entrega o troféu
      # para a pessoa errada, e só aparece quando já não dá para desfazer.
      - name: Apuração dos GB Awards (maior emissor e maior prêmio)
        run: npm run test:premiacao

      # A planilha geral é a porta de entrada de TODOS os números da carteira.
      # Em julho/2026 ela chegou com 65 linhas de prêmio incoerente e o código
      # de um assessor na apólice de outro — nenhum dos dois quebra nada, os
      # dois produzem número errado com cara de certo.
      - name: Leitor da planilha geral (prêmio e cadastro de assessor)
        run: npm run test:planilha

      - name: Subscrição, objeções e beneficiários
        run: npm run test:conhecimento

      - name: Análise de transcrição, comparador e apresentação
        run: |
          npm run test:transcricao
          npm run test:comparador
          npm run test:apresentacao

      - name: Instalar o Chromium (para os testes de tela)
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Rodar os testes ponta-a-ponta (modo demo)
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # sobe o site em segundo plano (sem .env → modo demonstração)
          npm run preview &
          echo "Aguardando o servidor responder em http://localhost:4173 ..."
          for i in $(seq 1 40); do
            curl -sf http://localhost:4173 >/dev/null && { echo "no ar!"; break; }
            sleep 1
          done
          npm run test:e2e

      - name: Guardar as capturas de tela (só se algo falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: e2e-shots/
          if-no-files-found: ignore
