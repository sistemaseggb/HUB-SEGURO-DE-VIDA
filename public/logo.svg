<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512">
  <defs>
    <g id="siluetaB">
      <rect x="338" y="212" width="42" height="222" />
      <path d="M 380 212 L 466 212 A 56 56 0 0 1 466 324 L 380 324 Z" />
      <path d="M 380 324 L 500 324 A 68 68 0 0 1 500 458 L 318 458 L 380 408 Z" />
    </g>
    <!-- recorta o anel onde o B passa (transparente, não branco) -->
    <mask id="mAnel">
      <rect x="0" y="0" width="900" height="512" fill="#fff" />
      <use href="#siluetaB" fill="#000" stroke="#000" stroke-width="18" />
    </mask>
    <!-- separa a cauda/barrigas da haste e do tique -->
    <mask id="mCorpo">
      <rect x="0" y="0" width="900" height="512" fill="#fff" />
      <rect x="338" y="212" width="42" height="222" fill="#000" stroke="#000" stroke-width="14" />
      <rect x="338" y="446" width="42" height="23" fill="#000" stroke="#000" stroke-width="14" />
    </mask>
  </defs>

  <!-- anel do G aberto entre 1h e 2h -->
  <path d="M 374 202 A 150 150 0 1 1 321 135" mask="url(#mAnel)"
        fill="none" stroke="#16161a" stroke-width="50" />

  <!-- barrigas e cauda do B (contadores vazados; recorte da haste via máscara) -->
  <g mask="url(#mCorpo)">
    <path fill="#16161a" fill-rule="evenodd" d="M 380 212 L 466 212 A 56 56 0 0 1 466 324 L 380 324 Z
      M 394 252 L 450 252 A 18 18 0 0 1 450 288 L 394 288 Z" />
    <path fill="#16161a" fill-rule="evenodd" d="M 380 324 L 500 324 A 68 68 0 0 1 500 458
      L 318 458 L 380 408 Z
      M 394 362 L 486 362 A 28 28 0 0 1 486 418 L 394 418 Z" />
  </g>

  <!-- cunha do G emendada na haste -->
  <path d="M 116 262 L 210 212 L 342 212 L 342 262 Z" fill="#16161a" />
  <rect x="338" y="212" width="42" height="222" fill="#16161a" />

  <!-- tiques laranja -->
  <rect x="338" y="446" width="42" height="23" fill="#e2702e" />
  <rect x="-25" y="-11" width="50" height="23" rx="2" fill="#e2702e"
        transform="translate(352 106) rotate(30)" />

  <!-- barra divisória -->
  <rect x="700" y="118" width="15" height="364" fill="#16161a" />
</svg>
